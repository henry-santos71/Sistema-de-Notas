<!DOCTYPE html>
<html lang="Pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Notas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <h1>Notas da Turma</h1>

        <p class="descricao">Informe quantos alunos serão cadastrados e depois digite o nome e as notas de cada um</p>

        <label for="txtQuantidade">Quantidade de Alunos:</label>
        <input type="number" id="txtQuantidade" min="1">

        <button id="btnCadastrar">Cadastrar Alunos</button>

        <div id="resultado">Relatorio</div>

        <div class="faixas">
            <h3>Classificação</h3>
            <p><span class="bolinha verde"></span>7,0 a 10,00 → <strong>Aprovados</strong></p>
            <p><span class="bolinha amarela"></span>5,0 a 6,99 → <strong>Recuperação</strong></p>
            <p><span class="bolinha vermelha"></span>0,00 a 4,99 → <strong>Reprovados</strong></p>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
